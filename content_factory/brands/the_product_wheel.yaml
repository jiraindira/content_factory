topic_policy:
  allowlist:
  - 'I run The Product Wheel, a buying guide site that helps people decide what to
    buy faster. I narrow crowded categories like travel gear, home essentials and
    tech accessories down to a few picks backed by research, and often by products
    we''ve bought and used at home. Gifts are my main focus: I want to take the stress
    out of finding something thoughtful for someone, whatever their age or interests.'
core_beliefs: '1. There are plenty of products out there, and knowing which one to
  pick can be time-consuming and nerve-wracking. Our goal is to simplify it and recommend
  proven products, with a high likelihood that we''ve already bought them for our
  own home.


  2. You shouldn''t need to read 40 reviews to buy a suitcase. A short list of picks
  you can trust beats an endless list of options.


  3. Proven beats new. We''d rather recommend something that has held up through years
  of real use than whatever launched last month.


  4. Good gear earns its place by making everyday life easier: fewer things lost,
  less clutter, smoother trips. If it doesn''t do that, it isn''t worth buying.


  5. We only recommend what we''d buy again. If something let us down, we say so.'
formative_experiences: Not applicable
desired_outcome: We want to cut the time people spend searching for what to buy by
  pointing them to products that come recommended, either from our own research or
  because we've used them ourselves. Above all, we want to solve the "what do I get
  them?" problem, so that finding a thoughtful gift takes minutes, not hours.
