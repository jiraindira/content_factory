content: '# Stop Trying to Bounce Back From Rejection — Bounce Forward Instead


  ## The Problem With Bouncing Back


  There''s a phrase we use so casually in sales that most people never stop to question
  it: *bounce back*. It sounds resilient. It sounds like the right thing to do. But
  if you slow down and really hear what it''s saying, you''ll notice something troubling
  embedded in the metaphor itself — it assumes you''ve already been knocked flat.
  And not just that. It assumes the goal is to return. To recover who you were before
  the rejection hit. To get back to the baseline.


  That''s not growth. That''s survival.


  And here''s the deeper problem: the moment you see rejection as something to recover
  *from*, you''ve already given it more power than it deserves. Every "no" becomes
  a blow. Every unanswered email becomes evidence. Every lost deal becomes a verdict.
  And when enough of those pile up — which they always do in sales — the weight doesn''t
  just slow you down. It can quietly extinguish what I''ve come to call your flame:
  the inner drive, the motivation, the will that gets you back on the phone after
  a brutal week.


  That flame isn''t infinite. It needs tending. And the way most salespeople have
  been taught to think about rejection is slowly starving it.


  ## Rejection Is Data, Not a Verdict


  I spent seven and a half years as a flight attendant with Singapore Airlines before
  I ever stepped into sales. When I made the switch at thirty, I thought the relational
  skills I''d built would translate easily. Then I took a job running roadshows for
  a bank, getting people to sign up for a free credit card — free, with rewards —
  and in three days of approaching two to three hundred strangers a day, I closed
  exactly three deals. One full day ended at zero.


  It was crushing in a way I hadn''t anticipated. Not because I lacked skill. But
  because I hadn''t yet learned how to process rejection without letting it compound.
  Each "no" was feeding the next one. By the end of that third day, the story I was
  telling myself had already moved from "that person wasn''t interested" to "I''m
  not cut out for this."


  That gap — between what actually happened and the meaning I attached to it — is
  where most salespeople lose the game before they''ve even lost the deal.


  Here''s what I''ve come to understand after years of working with people across
  sales: a rejection is information. Nothing more. The prospect exercised a right
  we all exercise every day. They said no to this offer, at this moment, for reasons
  that may have nothing to do with you. When you reframe it that way — truly reframe
  it, not just repeat it as a mantra — something shifts. You stop defending yourself
  against rejection and start learning from it. That''s not a subtle difference. It''s
  the entire game.


  The goal isn''t to build thicker skin. Thick skin assumes there''s an attack you
  need to defend against. The goal is to stop treating each "no" as a wound that needs
  healing and start treating it as a signal worth reading.


  ## The Flame Metaphor That Changed My Thinking


  A few years ago I was talking with my mentor Ron Kaufman about what I was writing
  — specifically about why so many capable, skilled salespeople burn out. Ron paused,
  and then said something that I''ve never been able to shake.


  He said that most resilience advice starts with the assumption that rejection can
  hurt you, and then teaches you to recover. But what if you approached it differently?
  What if, instead of letting rejection threaten your flame, you let it *feed* it?
  What if every "no" became fuel rather than friction?


  That reframe — from bouncing back to bouncing *forward* — is at the heart of everything
  I''ve written since.


  Bouncing back means returning to who you were before the difficulty. Bouncing forward
  means the difficulty itself becomes part of what propels you. It''s not about pretending
  rejection doesn''t sting. It does. It''s about choosing what that sting means, and
  what you do with it next. The salespeople I''ve seen sustain long careers, real
  ones built on genuine relationships and consistent results, aren''t people who feel
  rejection less. They''re people who''ve learned to metabolise it differently. They
  feel it, acknowledge it, and use it — without letting it sit in their chest for
  days eroding their confidence.


  That''s the practice. And it starts with the story you tell yourself the moment
  after a door closes.


  ## What You Say to Yourself Is the Architecture


  Your beliefs don''t live in the abstract. They live in the sentences you speak to
  yourself between calls, on the drive home, in the quiet moment after another prospect
  goes cold. And most of the time, you''re not even aware it''s happening.


  I''ve sat with enough salespeople over the years to know that the real breaking
  point is almost never skill. The person who''s struggling to hit targets usually
  knows how to present. They know how to handle objections. What''s unravelling is
  the internal dialogue — the slow accumulation of interpretations that starts to
  harden into belief. *Nobody wants what I''m selling. I''m just not built for this.
  It''s the market, it''s the timing, it''s everything out there.*


  The shift I always try to create is this: move from operating at the effect of your
  circumstances to operating at the cause of your response. You can''t control whether
  someone says yes. You can''t control market conditions, timing, or what your competitor
  offered. But you can control the meaning you assign to what happens, and what you
  choose to do next. That''s not a small thing. That''s where your actual power lives.


  And practically, this means building habits that protect your thinking — not just
  when you''re motivated, but especially when you''re not. Motivation is the spark.
  Habits are the structure that keeps the flame alive when the spark is low. A short
  walk after a rough day. Five minutes of journalling to process what you''re actually
  feeling instead of suppressing it. Reconnecting with the *why* behind your goals
  — not the surface why, but the one underneath it, the one that actually matters
  to you.


  The salespeople I''ve watched thrive over the long run aren''t the ones who never
  feel low. They''re the ones who''ve built small, consistent practices that mean
  they never stay low for long.


  ## The Last Thing Worth Remembering


  At the end of it all, what makes sales genuinely sustainable — and genuinely satisfying
  — is this: your function isn''t to extract a yes from every person you meet. It''s
  to help the people in front of you make the right decision for their lives. When
  you lead with that, trust builds naturally. People sense it. And when trust is real,
  you become someone they want to buy from — not someone they feel pressured by.


  The rejection that stings least is the one you''ve already decided to learn from.
  And the flame that burns brightest is the one you''ve decided to tend, not just
  wait for inspiration to reignite. Every no you''ve ever heard was the path you were
  already on. The question has never been whether rejection would show up. It always
  does. The question is what you''ll become because of how you chose to walk through
  it.'
