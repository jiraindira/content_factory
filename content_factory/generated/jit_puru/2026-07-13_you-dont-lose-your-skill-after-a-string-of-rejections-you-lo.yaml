content: '# You Don''t Lose Your Skill After a String of Rejections. You Lose Your
  Will. Here''s How to Get It Back.


  There''s a specific kind of silence that follows a string of rejections. Not the
  peaceful kind. The kind that sits on your chest. You know your product. You know
  your process. You''ve done this before and done it well. But somewhere after the
  fifth, the eighth, the eleventh "no" in a row, something shifts — and it isn''t
  your ability. It''s your desire to keep going.


  I''ve watched this happen to salespeople who were genuinely talented. I''ve felt
  it myself. And the most dangerous part is how quietly it happens. You don''t suddenly
  forget how to present. You don''t lose your knowledge of the product overnight.
  What goes first is something far more fragile — the will to pick up the phone again,
  to walk into the next meeting with your energy intact, to believe that this one
  might be different.


  That distinction matters more than most sales training ever acknowledges.


  ## The Skill Stays. The Flame Flickers.


  A mentor of mine, Ron Kaufman, once described motivation as a candle flame. It''s
  what lights the room. It''s what gets you back in the game. And like any flame,
  it''s not invincible. A sudden gust can extinguish it — but more often, it''s the
  quiet things that do the damage. The ignored follow-up emails. The week where nothing
  closes. The slow erosion of belief that comes not from one dramatic failure, but
  from the accumulation of small disappointments you never properly processed.


  When a salesperson stops performing, the instinct is to question their technique.
  Retrain them. Sharpen their pitch. But technique isn''t what''s missing. What''s
  missing is the inner fire that makes any technique worth using. Your skills are
  still there, waiting. It''s the will to deploy them that needs tending.


  This is why I''ve come to believe that protecting your emotional state isn''t a
  soft, secondary concern in sales — it is the work. You can have the best closing
  strategy in the world, but if you walk into a conversation carrying the emotional
  weight of twelve consecutive rejections, it will leak through. Prospects feel it.
  They buy into you before they ever buy your product, and a depleted version of you
  is a much harder sell than a resilient one.


  ## What Rejection Is Actually Telling You


  Here''s the reframe that changed how I approach this entirely: rejection is not
  a verdict. It is data.


  When a prospect says no, they are exercising a right you yourself have exercised
  a thousand times — the right to pass on something that isn''t right for them, right
  now. That''s all it is. The no isn''t a judgment of your worth. It isn''t proof
  that you were never cut out for this. It''s a single data point in a numbers-driven
  process, and the only way it becomes something larger is if you allow it to.


  I think about the early days of my own career in sales. I''d come from seven and
  a half years as a flight attendant with Singapore Airlines — I knew how to connect
  with people, I understood service, I thought I was reasonably prepared. Then I took
  a job running credit card signups at roadshows, and in three days I faced more rejection
  than I had in the previous year and a half combined. Three hundred approaches in
  a day. Three signups across three days. One day with zero. The confidence I''d walked
  in with was entirely dismantled.


  What saved me wasn''t a new script. It was recognising that the only thing standing
  between me and my next yes was how I chose to let the last no affect me. That''s
  not a platitude — it''s a practical truth about where your actual control lives.
  You cannot control whether someone says yes. You can absolutely control what meaning
  you assign to the no, and what you do in the minutes that follow it.


  When you start seeing rejection as proof that you''re in motion — that you''re out
  there, presenting, engaging, creating opportunities — it stops being a wound and
  starts being a signal. You''re in the game. The question is whether you stay in
  it.


  ## The Quiet Danger of Stagnation That Isn''t Stagnation


  There''s another phase that comes for salespeople that doesn''t get talked about
  enough, and it''s more insidious than outright rejection. It''s the plateau — the
  stretch of time where you''re doing everything right and nothing seems to be moving.
  You''re making the calls, attending the meetings, following up with care. But the
  results have flattened, and the silence is starting to feel like an answer.


  It isn''t. What looks like stagnation is almost always preparation. Beneath the
  surface, your approach is being refined, your instincts are sharpening, your relationships
  are deepening in ways that don''t yet show on a spreadsheet. Growth in sales — like
  growth in most things — is not linear. There are stretches where the progress is
  invisible, and those stretches are exactly where most people quit, just before the
  breakthrough.


  The antidote isn''t to push harder in a panicked way. It''s to stay consistent,
  stay grounded in your purpose, and resist the urge to interpret silence as failure.
  Ask yourself why you''re doing this — not the surface answer, but the real one.
  The one that doesn''t depend on this week''s results. A strong enough reason to
  keep going is the thing that carries you through a plateau when motivation alone
  has run dry. Motivation is a feeling, and feelings are unreliable fuel. Habits and
  purpose are what remain when the feeling isn''t there.


  ## How to Tend the Flame When It''s Low


  Getting your will back after a difficult stretch isn''t dramatic. It doesn''t require
  a grand recommitment or a motivational speech. It requires small, deliberate acts
  done consistently — the kind that rebuild your internal state before you walk into
  the next conversation.


  Journalling your way through the emotional weight of a tough week is one of the
  most underrated tools I know. Not to perform self-reflection, but to actually ask
  yourself: what am I feeling right now, what caused it, and what do I want to do
  next? Writing slows the spiral. It turns a fog of discouragement into something
  you can actually look at and work with.


  Movement matters too — more than most people give it credit for. A walk, a workout,
  even ten minutes of something physical shifts your neurological state in ways that
  thinking alone cannot. Gratitude, practiced genuinely rather than as a ritual, reorients
  your attention toward what''s working rather than what isn''t. And reaching out
  — to a mentor, a colleague, a friend who understands the game — reminds you that
  what you''re experiencing isn''t a personal failing. It''s the texture of the work.


  Above all, watch what you say to yourself in the hours after a rejection. The internal
  dialogue that follows a no is where the real damage either happens or doesn''t.
  "I''m not good at this" is a story. "That wasn''t the right fit" is a fact. The
  difference in what follows those two thoughts is enormous.


  The salespeople who last — the ones who build something real and sustainable over
  years — are not the ones who never got knocked around. They''re the ones who learned
  to tend their flame with the same diligence they brought to their craft. They understood
  that the skill stays. It''s the will that needs protecting. And every time they
  chose to keep going — not because it felt good, but because they knew why they were
  there — they built something no rejection could touch.'
